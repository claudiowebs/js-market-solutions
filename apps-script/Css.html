<style>
  :root {
    --navy: #0f1e40;
    --navy-2: #1a2b55;
    --blue: #0066a2;
    --cyan: #00a3e0;
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --danger: #dc2626;
    --ok: #16a34a;
    --warn: #d97706;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--navy);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 38px; height: 38px; border-radius: 10px; background: #fff; padding: 4px; display: grid; place-items: center; }
  .brand-icon svg { width: 100%; height: 100%; }
  .brand-name { font-weight: 700; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12px; color: #a8b3cf; }

  .tabs { display: flex; background: var(--navy-2); border-radius: 10px; padding: 3px; }
  .tab {
    border: 0;
    background: transparent;
    color: #c7d0e6;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab.active { background: #fff; color: var(--navy); }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--cyan); color: #fff; font-size: 12px; }

  .shell { max-width: 720px; margin: 0 auto; padding: 16px 16px 110px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(15, 30, 64, 0.04);
  }
  .card-head { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 12px; }
  .step { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 13px; display: grid; place-items: center; }

  .input, .search input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus, .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 102, 162, 0.15); }

  .search { position: relative; flex: 1; }
  .search input { padding-left: 40px; }
  .search-icon { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: var(--muted); }

  .picker { position: relative; }
  .results {
    list-style: none;
    margin: 6px 0 0;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    max-height: 320px;
    overflow-y: auto;
    background: #fff;
    box-shadow: 0 8px 24px rgba(15, 30, 64, 0.08);
  }
  .result { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .result:hover, .result.active { background: #eef6fb; }
  .result-name { font-weight: 600; }
  .result-meta { font-size: 13px; color: var(--muted); }
  .result mark { background: #cdeefa; color: inherit; border-radius: 3px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .client { border: 1px solid #cfe7f3; background: linear-gradient(180deg, #f2f9fd, #fff); border-radius: 12px; padding: 14px; }
  .client-top { display: flex; justify-content: space-between; gap: 12px; }
  .client-name { font-size: 17px; font-weight: 700; color: var(--navy); }
  .client-address { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .chip b { color: var(--muted); font-weight: 500; margin-right: 2px; }

  .link { border: 0; background: none; color: var(--blue); font-weight: 600; font-size: 14px; cursor: pointer; padding: 0; }
  .link.danger { color: var(--danger); }

  .recorder { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 8px 0; }
  .mic {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 0;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    box-shadow: 0 8px 20px rgba(0, 102, 162, 0.35);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .mic:active { transform: scale(0.96); }
  .mic:disabled { opacity: 0.4; cursor: not-allowed; }
  .mic-icon { width: 36px; height: 36px; fill: #fff; }
  .stop-icon { display: none; width: 26px; height: 26px; border-radius: 6px; background: #fff; }
  .recording .mic { background: var(--danger); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); animation: ring 1.4s infinite; }
  .recording .mic-icon { display: none; }
  .recording .stop-icon { display: block; }
  .timer { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--navy); }
  .recording .timer { color: var(--danger); }
  .rec-status { font-size: 13px; color: var(--muted); }
  .recorder audio { width: 100%; margin-top: 6px; }
  .rec-actions { display: flex; gap: 18px; justify-content: center; margin-top: 4px; }
  .error { color: var(--danger); font-size: 13px; }
  @keyframes ring { 70% { box-shadow: 0 0 0 16px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }

  .actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(243, 245, 249, 0.92);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
  }
  .btn-primary {
    display: block;
    width: 100%;
    max-width: 688px;
    margin: 0 auto;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
  }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-ghost { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 11px 14px; font-weight: 500; cursor: pointer; }

  .list-tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .filter.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .records { display: grid; gap: 10px; }
  .record { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .record-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .record-name { font-weight: 600; color: var(--navy); }
  .record-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .record-actions { display: flex; gap: 16px; margin-top: 10px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .st-CON_AUDIO { background: #dcfce7; color: #166534; }
  .st-SOLO_TEXTO { background: #dbeafe; color: #1e40af; }
  .st-ERROR { background: #fee2e2; color: #991b1b; }
  .st-SIN_DATOS { background: #e2e8f0; color: #334155; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 50;
    max-width: calc(100% - 32px);
    box-shadow: 0 8px 24px rgba(15, 30, 64, 0.25);
  }
  .toast.err { background: var(--danger); }
  .overlay { position: fixed; inset: 0; background: rgba(15, 30, 64, 0.35); display: grid; place-items: center; z-index: 60; }
  .spinner { width: 42px; height: 42px; border: 4px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logout { border: 1px solid rgba(255, 255, 255, 0.25); background: transparent; color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin-left: auto; }
  .login { max-width: 420px; margin: 32px auto 0; text-align: center; display: grid; gap: 14px; padding: 28px 22px; }
  .login-icon { width: 56px; height: 56px; margin: 0 auto; border-radius: 16px; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: grid; place-items: center; }
  .login-icon svg { width: 28px; height: 28px; fill: #fff; }
  .login-title { font-size: 20px; margin: 0; color: var(--navy); }
  .login-text { margin: 0; color: var(--muted); font-size: 14px; }
  .input-lg { text-align: center; font-size: 20px; letter-spacing: 0.2em; padding: 14px; }
  .input-lg::placeholder { letter-spacing: normal; font-size: 16px; }
  .login .btn-primary { max-width: none; }

  .notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 14px; }
  .notice-warn { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
  .notice-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
  .notice-link { flex-shrink: 0; background: var(--navy); color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; }
  .mic-help { text-align: left; font-size: 13px; background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; border-radius: 10px; padding: 12px 14px; width: 100%; }
  .textarea { display: block; margin-top: 14px; min-height: 88px; resize: vertical; line-height: 1.45; }
  .record-obs { margin-top: 10px; font-size: 14px; border-left: 3px solid var(--cyan); padding: 6px 10px; background: #f2f9fd; border-radius: 6px; white-space: pre-wrap; }
  .mic-help ol { margin: 6px 0 0; padding-left: 18px; }

  @media (max-width: 520px) {
    .topbar { padding: 10px 12px; }
    .tabs { width: 100%; }
    .tab { flex: 1; }
    .shell { padding: 12px 12px 110px; }
  }
</style>
